name: Build Zombie Eaters for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game.js'
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows game folder
        run: npm run build:win
      - name: Add Aether package manifest
        shell: pwsh
        run: |
          $folder = "dist/win-unpacked"
          if (!(Test-Path $folder)) { throw "Windows game folder was not created." }
          $exe = Get-ChildItem $folder -Filter "*.exe" | Select-Object -First 1
          if (!$exe) { throw "Game executable was not created." }
          $manifest = @{
            game_name = "Zombie Eaters"
            platform = "windows"
            entry_exe = $exe.Name
            aether_public_key = "ADD_YOUR_CURRENT_AETHER_PUBLIC_KEY_HERE"
            version = "1.0.0"
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $folder "aether.manifest.json") -Value $manifest -Encoding utf8
      - name: Upload complete game folder
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Eaters-Windows-Game-Folder
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 30