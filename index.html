<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Eaters</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d13;color:#f2f4e9;font-family:system-ui;display:grid;place-items:center;min-height:100vh;padding:18px}.wrap{width:min(1100px,100%)}header{display:flex;justify-content:space-between;margin-bottom:12px}.logo{font:bold 22px monospace;color:#c7f36b}.tag{color:#9da9a2;font-size:12px;letter-spacing:2px}.frame{background:#141e25;border:4px solid #344a43;padding:10px}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:5px 4px 12px;font:bold 12px monospace}.hud b{color:#c7f36b}.stage{position:relative}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#07100bd9;text-align:center;padding:22px}.box{max-width:540px}.box h1{font:bold clamp(22px,4vw,36px) monospace;line-height:1.5;color:#c7f36b}.box p{line-height:1.7}.btn{background:#c7f36b;color:#152018;border:0;padding:14px 18px;font-weight:900;cursor:pointer}.hint,.bottom{font-size:12px;color:#9eaea2}.bottom{display:flex;justify-content:space-between;padding:12px 2px}.mobile{display:none;gap:8px;justify-content:center;margin-top:12px}.mobile button{width:54px;height:48px;background:#1b2a23;color:white;border:1px solid #516a59}@media(max-width:650px){.tag{display:none}.mobile{display:flex}}</style></head>
<body><div class="wrap"><header><div class="logo">☣ ZOMBIE EATERS</div><div class="tag">PIXEL ARENA · SURVIVE THE NIGHT</div></header><div class="frame"><div class="hud"><span>HEALTH <b id="health">100</b></span><span>WAVE <b id="wave">1</b></span><span>SCORE <b id="score">0</b></span><span>STREAK <b id="streak">0</b></span></div><div class="stage"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="box"><h1 id="overlayTitle">ZOMBIE<br>EATERS</h1><p id="overlayText">Dodge the goofy ghouls, use your energy strikes, and survive every wave.</p><p class="hint">MOVE: WASD / ARROWS · STRIKE: SPACE / J · DASH: SHIFT / K</p><button class="btn" id="start">START FIGHT</button></div></div></div></div><div class="mobile"><button data-key="a">◀</button><button data-key="w">▲</button><button data-key="s">▼</button><button data-key="d">▶</button><button data-key="j">✦</button><button data-key="k">⚡</button></div><div class="bottom"><span>ARCADE MODE · CARTOON PIXEL ACTION</span><span id="status">Ready.</span></div></div><script src="game.js"></script></body></html>
